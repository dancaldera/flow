<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Flow logo glyph: a voice waveform that flows into a line of text -->
  <defs>
    <linearGradient id="flow-g" gradientUnits="userSpaceOnUse" x1="88" y1="256" x2="424" y2="256">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <g stroke="url(#flow-g)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- waveform flattening into the first text line -->
    <path d="M88 256
             C102 256 102 166 120 166
             C138 166 138 256 152 256
             C166 256 166 386 184 386
             C202 386 202 256 216 256
             C230 256 230 176 246 176
             C262 176 262 256 278 256
             L424 256"/>
    <!-- remaining text lines -->
    <path d="M278 318 H424"/>
    <path d="M278 380 H372"/>
  </g>
</svg>
