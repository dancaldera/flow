name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      # A release tag must match the version in package.json; manual runs skip this.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="v$(jq -r .version package.json)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $TAG does not match package.json version $VER"
            echo "Bump with: pnpm version patch|minor|major, then git push --follow-tags"
            exit 1
          fi

      # Signs with the Apple Development cert when CSC_LINK/CSC_KEY_PASSWORD
      # secrets are set (stable TCC permissions + Keychain across releases);
      # falls back to ad-hoc so the job still succeeds without secrets.
      - name: Build DMGs (arm64 + x64)
        run: |
          pnpm run build
          if [ -n "$CSC_LINK" ]; then
            pnpm exec electron-builder build --mac --x64 --arm64 --publish never
          else
            pnpm exec electron-builder build --mac --x64 --arm64 --publish never -c.mac.identity=-
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
