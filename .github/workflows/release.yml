name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      # A release tag must match the version in package.json; manual runs skip this.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="v$(jq -r .version package.json)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $TAG does not match package.json version $VER"
            echo "Bump with: pnpm version patch|minor|major, then git push --follow-tags"
            exit 1
          fi

      # Signs with the project's self-signed "Flow" cert when CSC_LINK/CSC_KEY_PASSWORD
      # secrets are set (stable TCC permissions + Keychain across releases);
      # falls back to ad-hoc so the job still succeeds without secrets.
      - name: Build DMGs (arm64 + x64)
        run: |
          pnpm run build
          if [ -n "$CSC_LINK" ]; then
            echo "$CSC_LINK" | base64 --decode > /tmp/flow-cert.p12
            openssl pkcs12 -in /tmp/flow-cert.p12 -passin pass:"$CSC_KEY_PASSWORD" -clcerts -nokeys 2>/dev/null \
              | openssl x509 > /tmp/flow-cert.pem
            security create-keychain -p flowbuild flowbuild.keychain
            security import /tmp/flow-cert.p12 -k flowbuild.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k flowbuild flowbuild.keychain
            security list-keychains -d user -s $(security list-keychains -d user | tr -d '"' | tr '\n' ' ') "$PWD/flowbuild.keychain"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign \
              -k /Library/Keychains/System.keychain /tmp/flow-cert.pem
            unset CSC_LINK
            pnpm exec electron-builder build --mac --x64 --arm64 --publish never
            rm -f /tmp/flow-cert.p12 /tmp/flow-cert.pem
          else
            pnpm exec electron-builder build --mac --x64 --arm64 --publish never -c.mac.identity=-
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          generate_release_notes: true
